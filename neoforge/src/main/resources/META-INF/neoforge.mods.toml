modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/Wagers-of-Industrial-Warfare/RitchiesProjectileLib/issues"
license = "MIT"

[[mods]]
modId = "ritchiesprojectilelib"
version = "${version}"
displayName = "Ritchie's Projectile Library"
authors = "rbasamoyai"
description = '''A Minecraft modding library for better projectiles.'''
logoFile = "icon.png"

[[mixins]]
config = "ritchiesprojectilelib.mixins.json"

[[dependencies.ritchiesprojectilelib]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ritchiesprojectilelib]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
